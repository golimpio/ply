# The ply iOS app (docs/M11-CLIENTS.md). XcodeGen makes Ply.xcodeproj from this file: run `make`
# here, never edit the generated project. Everything the app needs to build lives under ios/.
#
# Requires Xcode 26 or newer (Swift 6.2: SWIFT_DEFAULT_ACTOR_ISOLATION and `nonisolated` on types)
# and XcodeGen (`brew install xcodegen`). The Makefile checks both.
name: Ply
options:
  bundleIdPrefix: com.ply
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_STRICT_CONCURRENCY: complete
    # Every user-facing string is a candidate for the String Catalog (`Ply/Localizable.xcstrings`).
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${PLY_TEAM}
# What the two app-hosted test targets (PlyAppTests, PlyTVAppTests) share.
targetTemplates:
  AppTests:
    type: bundle.unit-test
    sources:
      - path: PlyAppTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
targets:
  Ply:
    type: application
    platform: iOS
    sources:
      - path: Ply
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ply.ios
        PRODUCT_NAME: Ply
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Ply/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: ply
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  # The Foundation-only core (models, API client, feed and subtitle parsers) as a macOS logic test:
  # `make test` needs no simulator and no test debugger, so CI can run it anywhere.
  PlyCoreTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Ply/Core/Models.swift
      - path: Ply/Core/Meta.swift
      - path: Ply/Core/APIClient.swift
      - path: Ply/Core/EventFeed.swift
      - path: Ply/Core/WebVTT.swift
      - path: Ply/Core/DeviceContext.swift
      - path: Ply/Core/PlaybackPlan.swift
      - path: Ply/Core/ConnectFailure.swift
      - path: Ply/Core/CommandHistory.swift
      - path: Ply/Core/NextEpisode.swift
      - path: Ply/Core/Fuzzy.swift
      - path: Ply/Core/SearchHistory.swift
      - path: Ply/Core/ShowOrder.swift
      - path: Ply/Core/PeopleQuery.swift
      - path: Ply/Core/PlaybackPresentation.swift
      - path: Ply/Core/PlaybackWindows.swift
      - path: Ply/App/LibraryModel.swift
      - path: Ply/Core/Discovery.swift
      - path: PlyCoreTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ply.ios.coretests
        GENERATE_INFOPLIST_FILE: YES
  # The Apple TV app: the same core, feed, player and pages as the phone, with the TV's focus
  # navigation. Its own entry point is PlyTV/PlyTVApp.swift; the iOS PlyApp.swift is not built here.
  PlyTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: Ply/Core
      - path: Ply/App/AppModel.swift
      - path: Ply/App/LibraryModel.swift
      - path: Ply/App/BrowseModel.swift
      - path: Ply/App/AppShell.swift
      - path: Ply/Player
      - path: Ply/Views
      - path: Ply/Localizable.xcstrings
      - path: Ply/PrivacyInfo.xcprivacy
      - path: PlyTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ply.tvos
        PRODUCT_NAME: Ply
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: PlyTV/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: ply
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # Tests that need the app itself (its bundle, UIKit, the player): hosted in the iPhone/iPad app
  # and in the Apple TV app, on a simulator. `make app-test` and `make tv-test` run them, and they
  # are the test action of the Ply and PlyTV schemes, so Xcode's own test runner finds them too.
  PlyAppTests:
    templates: [AppTests]
    platform: iOS
    dependencies:
      - target: Ply
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ply.ios.apptests
  PlyTVAppTests:
    templates: [AppTests]
    platform: tvOS
    deploymentTarget: "17.0"
    dependencies:
      - target: PlyTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ply.tvos.apptests
        # The TV app's product is Ply.app, not PlyTV.app, so XcodeGen's guess of the host is wrong.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Ply.app/Ply
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Ply:
    build:
      targets:
        Ply: all
        PlyAppTests: [test]
    test:
      targets:
        - PlyAppTests
  PlyTV:
    build:
      targets:
        PlyTV: all
        PlyTVAppTests: [test]
    test:
      targets:
        - PlyTVAppTests
  PlyCore:
    build:
      targets:
        PlyCoreTests: [test]
    test:
      targets:
        - PlyCoreTests
